; PgBouncer in TRANSACTION pooling mode: every app service connects here.
; Migrations connect directly to Postgres, never through this.
[databases]
ratify = host=postgres port=5432 dbname=ratify
; Same database with a pool of 2 server connections: used by the
; concurrency isolation test (tests/pgbouncer_test.go) to force heavy reuse.
ratify_small = host=postgres port=5432 dbname=ratify pool_size=2

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
default_pool_size = 20
max_client_conn = 300
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT uname, phash FROM pgbouncer.user_lookup($1)
ignore_startup_parameters = extra_float_digits
server_reset_query_always = 0
log_connections = 0
log_disconnections = 0
