name: ratify

services:
  postgres:
    image: postgres:17.5
    mem_limit: 4g
    cpus: 1.5
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ratify
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      # TCP check: the init-time temporary server only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ratify"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.3-alpine
    mem_limit: 256m
    cpus: 0.25
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["../migrations:/migrations:ro"]
    command: ["-path=/migrations", "-database", "postgres://app_migrator:${MIGRATOR_PASSWORD}@postgres:5432/ratify?sslmode=disable", "up"]

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 3s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    mem_limit: 256m
    cpus: 0.15
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  kafka:
    image: apache/kafka:4.0.0
    mem_limit: 2g
    cpus: 1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1024m"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  relay:
    build: {context: .., dockerfile: deploy/Dockerfile.relay}
    image: ratify-relay:0.2.0
    mem_limit: 256m
    cpus: 0.25
    depends_on:
      kafka: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgres://relay_user:${RELAY_USER_PASSWORD}@pgbouncer:6432/ratify?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      RELAY_INSTANCE_ID: relay-1
      GOMEMLIMIT: 200MiB
    restart: unless-stopped

  pyworker:
    build: {context: .., dockerfile: deploy/Dockerfile.pyworker}
    image: ratify-pyworker:0.1.0
    mem_limit: 768m
    cpus: 0.5
    depends_on:
      kafka: {condition: service_healthy}
      pgbouncer: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_URL: postgres://ml_worker:${ML_WORKER_PASSWORD}@pgbouncer:6432/ratify?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      PYWORKER_SERVICE_TOKEN: ${PYWORKER_SERVICE_TOKEN}
    expose: ["8090"]   # internal only: deliberately NOT published on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    image: ratify-api:0.1.0
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      ENV: ${ENV:-development}
      ADDR: ":8080"
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@pgbouncer:6432/ratify?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      CURSOR_SECRET: ${CURSOR_SECRET:-}
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # FerrisKey (OIDC). Official images, pinned. Realm-per-tenant, tokens carry
  # tenant_id and roles claims: see README "Authentication". Its database lives
  # in the shared Postgres (database `ferriskey`, role ferriskey_user) and it
  # connects directly (it needs DDL/migrations; it is not an app service).
  ferriskey-migrate:
    image: ghcr.io/ferriskey/ferriskey-api:0.10.2
    mem_limit: 128m
    cpus: 0.25
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["sqlx", "migrate", "run", "--source", "/usr/local/src/ferriskey/migrations"]
    environment:
      DATABASE_URL: postgresql://ferriskey_user:${FERRISKEY_PASSWORD}@postgres:5432/ferriskey

  ferriskey:
    image: ghcr.io/ferriskey/ferriskey-api:0.10.2
    mem_limit: 512m
    cpus: 0.25
    depends_on:
      ferriskey-migrate: {condition: service_completed_successfully}
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: ferriskey
      DATABASE_USER: ferriskey_user
      DATABASE_PASSWORD: ${FERRISKEY_PASSWORD}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5555
      WEBAPP_URL: http://localhost:5555
      ADMIN_USERNAME: ${FERRISKEY_ADMIN_USER}
      ADMIN_PASSWORD: ${FERRISKEY_ADMIN_PASSWORD}
      ADMIN_EMAIL: ${FERRISKEY_ADMIN_EMAIL}
    ports: ["127.0.0.1:3333:3333"]
    restart: unless-stopped

  # Admin console for realms/clients; opt-in (`--profile ops`).
  ferriskey-console:
    profiles: ["ops"]
    image: ghcr.io/ferriskey/ferriskey-webapp:0.10.2
    mem_limit: 128m
    cpus: 0.1
    environment:
      API_URL: http://localhost:3333
    ports: ["127.0.0.1:5555:80"]

  web:
    build: {context: ../web, dockerfile: ../deploy/Dockerfile.web}
    image: ratify-web:0.1.0
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      api: {condition: service_healthy}
    environment:
      API_URL: http://api:8080
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      APP_ENV: ${ENV:-development}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  promdata:
