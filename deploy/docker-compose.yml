name: ratify

services:
  postgres:
    image: postgres:17.5
    mem_limit: 4g
    cpus: 1.5
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ratify
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      # TCP check: the init-time temporary server only listens on a socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ratify"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.3-alpine
    mem_limit: 256m
    cpus: 0.25
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    mem_limit: 64m
    cpus: 0.25
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["../migrations:/migrations:ro"]
    command: ["-path=/migrations", "-database", "postgres://app_migrator:${MIGRATOR_PASSWORD}@postgres:5432/ratify?sslmode=disable", "up"]

  api:
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    image: ratify-api:0.1.0
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      ENV: ${ENV:-development}
      ADDR: ":8080"
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD}@postgres:5432/ratify?sslmode=disable
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Profile-gated until Sprint 1.3. Image must be a verified pinned tag.
  ferriskey:
    profiles: ["oidc"]
    image: ${FERRISKEY_IMAGE}
    mem_limit: 512m
    cpus: 0.25
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://ferriskey_user:${FERRISKEY_PASSWORD}@postgres:5432/ferriskey?sslmode=disable
    ports: ["127.0.0.1:3333:3333"]

volumes:
  pgdata:
